# If a config.py file exists, this file is ignored unless it's explicitly loaded
# via config.load_autoconfig(). For more information, see:
# https://github.com/qutebrowser/qutebrowser/blob/main/doc/help/configuring.asciidoc#loading-autoconfigyml
# DO NOT edit this file by hand, qutebrowser will overwrite it.
# Instead, create a config.py - see :help for details.

config_version: 2
settings:
  auto_save.session:
    global: true
  backend:
    global: webengine
  content.autoplay:
    global: false
  content.blocking.enabled:
    global: true
  content.blocking.method:
    global: adblock
  content.geolocation:
    https://www.speedtest.net: true
  content.headers.user_agent:
    global: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like
      Gecko) Chrome/120.0.0.0 Safari/537.36
  content.javascript.clipboard:
    https://account.proton.me: access-paste
    https://aur.archlinux.org: access-paste
    https://chat.deepseek.com: access-paste
    https://dash.cloudflare.com: access-paste
    https://discord.com: access-paste
    https://github.com: access-paste
    https://my.noip.com: access-paste
    https://one.dash.cloudflare.com: access-paste
    https://qrscanner.net: access-paste
    https://stackoverflow.com: access-paste
    https://vercel.com: access-paste
  content.notifications.enabled:
    https://web.whatsapp.com: true
  content.register_protocol_handler:
    https://mail.google.com?extsrc=mailto&url=%25s: true
    https://mail.proton.me#mailto=%25s: true
  fonts.default_family:
    global: fira sans
  fonts.default_size:
    global: 11pt
  fonts.tooltip:
    global: fira sans
  fonts.web.family.cursive:
    global: garamond
  fonts.web.family.fantasy:
    global: garamond
  fonts.web.family.fixed:
    global: fira code
  fonts.web.family.sans_serif:
    global: fira sans
  fonts.web.family.serif:
    global: garamond
  fonts.web.family.standard:
    global: fira sans
  statusbar.widgets:
    global:
    - keypress
    - search_match
    - url
    - scroll
    - history
    - tabs
    - progress
  url.default_page:
    global: https://searx.lewoof.xyz
  url.searchengines:
    global:
      DEFAULT: https://searx.lewoof.xyz/search?q={}
  url.start_pages:
    global: https://searx.lewoof.xyz
